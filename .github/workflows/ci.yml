# Checks every push and pull request: types, lint, unit tests, i18n parity and the override
# contract with the web submodule, then builds both apps from a fresh prebuild - Android as a
# debug APK and iOS for the simulator (unsigned; signing belongs to the release workflow).
# The iOS job is the only place the iOS app is compiled for most contributors, who are not on
# macOS, so it runs on every change rather than only before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:crypto-host
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run check:i18n
      - run: npm run check:overrides

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:crypto-host
      - run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: strafe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:crypto-host
      - run: npx expo prebuild --platform ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Strafe.xcworkspace -scheme Strafe -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200

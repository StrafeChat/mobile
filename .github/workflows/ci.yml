# Checks every push and pull request: types, lint, unit tests, i18n parity and the override
# contract with the web submodule, then builds both apps from a fresh prebuild - Android as a
# debug APK and iOS for the simulator (unsigned; signing belongs to the release workflow).
# The iOS job is the only place the iOS app is compiled for most contributors, who are not on
# macOS, so it runs on every change rather than only before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:crypto-host
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run check:i18n
      - run: npm run check:overrides

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:crypto-host
      - run: npx expo prebuild --platform android --no-install
      - name: Give Gradle room
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m/' android/gradle.properties
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: strafe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:crypto-host
      # The push decryption, payload and rendering sources the StrafePush module and the
      # Notification Service Extension share (RFC 8291 test vector included).
      - name: Test the shared push sources
        run: swift test --package-path modules/strafe-push/ios
      - run: npx expo prebuild --platform ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Strafe.xcworkspace -scheme Strafe -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -n 200
      # The scheme builds the extension as a dependency of the app; make sure it was embedded.
      - name: Check the Notification Service Extension is embedded
        run: |
          appex=ios/build/Build/Products/Debug-iphonesimulator/Strafe.app/PlugIns/StrafeNotificationService.appex
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist")" = com.apple.usernotifications.service
          test -x "$appex/StrafeNotificationService"
